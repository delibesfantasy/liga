
name: Crear tablas CAMPEONES

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  crear-tablas:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Crear tablas de la liga
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          command: d1 execute campeones-liga-db --remote --file=./schema.sql

      - name: Crear tablas de notificaciones
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker-notificaciones
          command: d1 execute campeones-notificaciones-db --remote --file=./schema.sql
